[project]
name = "ml-practical"
version = "0.1.0"
description = "Практика по машинному обучению"
readme = "README.md"
authors = [{ name = "sasha_mulyar", email = "sasiijob@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scikit-learn>=1.6.0",
]

[project.scripts]
ml-practical = "ml_practical:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["home-work", "class-work"]
extend-exclude = ["ML", "src"]
force-exclude = true
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*.ipynb" = ["E402", "B018"]

[dependency-groups]
dev = ["ruff==0.16.6"]
